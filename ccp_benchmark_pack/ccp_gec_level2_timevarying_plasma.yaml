case_id: ccp_gec_level2_timevarying_plasma
run: {root: runs/ccp_level2_table}

# A harder benchmark: the load is a synthetic time-varying R/L/C/Q table,
# representing the output of an external plasma simulation or reduced model.
variables:
  Vsrc_amp: {bounds: [100, 900], scale: linear, default: 500}
  Vsrc_dc: {bounds: [-80, 40], scale: linear, default: 0}

source:
  type: sine_voltage
  name: Vsrc
  p: src
  n: 0
  amplitude_V: Vsrc_amp
  dc_V: Vsrc_dc
  frequency_Hz: 13560000

circuit:
  builder: pi_match_harmonic
  output_node: electrode
  variables:
    C1: {bounds: [5.0e-12, 2.0e-9], scale: log, default: 2.0e-10}
    L1: {bounds: [2.0e-8, 5.0e-6], scale: log, default: 8.0e-7}
    C2: {bounds: [5.0e-12, 2.0e-9], scale: log, default: 2.0e-10}
    Lh: {bounds: [2.0e-8, 5.0e-6], scale: log, default: 3.0e-7}
    Ch: {bounds: [5.0e-12, 2.0e-9], scale: log, default: 1.0e-10}

load:
  name: plasma_table_rlcq
  ports: {p: electrode, n: 0}
  table_file: plasma_table_gec_argon_synthetic.csv
  Rleak_ohm: 1.0e12

measurement: {voltage_node: electrode, current_source: Vsrc}
solver:
  name: dummy
  tran: {step_s: 2.0e-10, stop_s: 7.3746e-7}

target:
  waveform_file: target_gec_tailored.csv
  objective: ccp_waveform_power_proxy
  fundamental_Hz: 13560000
  harmonics: [1, 2, 3]
  harmonic_weight: 0.25
  power_target_W: 80
  power_weight: 0.05
  constraints:
    max_abs_voltage_V: 1000
    max_abs_current_A: 25

plasma_io:
  export: true
  geometry: {electrode_diameter_m: 0.10, electrode_area_m2: 0.00785398163397, gap_m: 0.0245}
  process_condition: {gas: Ar, pressure_Pa: 13.3, frequency_Hz: 13560000}
  requested_outputs: [Rp_ohm, Lp_H, Csh_F, ion_flux_m2_s, ion_energy_distribution, dc_self_bias_V]

plugins: [plugins/ccp_metrics.py]
optimizer: {name: random, seed: 202}
