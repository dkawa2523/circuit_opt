# Test-only fixture for the explicit extension API. Public RF studies use
# pcd.rf.v1; this case keeps categorical registry selection and generic
# waveform orchestration covered without presenting them as engineering proof.
schema: case_yaml.v1
case_id: advanced_case_fixture
variables:
  topology_choice: {choices: [l_match, pi_match], default: pi_match}
  load_model: {choices: [parallel_rc, impedance_point], default: parallel_rc}
source:
  type: sine_voltage
  name: Vsrc
  p: src
  n: 0
  amplitude_V: 1
  frequency_Hz: 1000000
circuit:
  builder: $topology_choice
  output_node: electrode
  variables:
    C1: {bounds: [1.0e-12, 2.0e-9], scale: log, default: 2.0e-10}
    L1: {bounds: [1.0e-9, 5.0e-6], scale: log, default: 8.0e-7}
    C2: {bounds: [1.0e-12, 2.0e-9], scale: log, default: 2.0e-10}
load:
  name: $load_model
  ports: {p: electrode, n: 0}
  variables:
    Rload: {bounds: [5, 200], scale: log, default: 25}
    Cload: {bounds: [1.0e-12, 2.0e-10], scale: log, default: 5.0e-11}
    Xload: {bounds: [-200, -10], default: -80}
  R_ohm: Rload
  C_F: Cload
  resistance_ohm: Rload
  reactance_ohm: Xload
  model_frequency_Hz: 1000000
measurement:
  voltage_node: electrode
  current_source: Vsrc
  load_current: auto
solver:
  name: dummy
  tran: {step_s: 1.0e-8, stop_s: 5.0e-6}
target:
  waveform_file: target_waveform.csv
  objective: waveform_l2
optimizer: {name: random, seed: 11}
