case_id: ccp_gec_level1_fixed_match
run:
  root: runs/ccp_level1_fixed
variables:
  Vsrc_amp:
    bounds:
    - 100
    - 800
    scale: linear
    default: 450
source:
  type: sine_voltage
  name: Vsrc
  p: src
  n: 0
  amplitude_V: Vsrc_amp
  frequency_Hz: 13560000
circuit:
  builder: pi_match
  output_node: electrode
  variables:
    C1:
      bounds:
      - 5.0e-12
      - 2.0e-09
      scale: log
      default: 2.0e-10
    L1:
      bounds:
      - 2.0e-08
      - 5.0e-06
      scale: log
      default: 8.0e-07
    C2:
      bounds:
      - 5.0e-12
      - 2.0e-09
      scale: log
      default: 2.0e-10
load:
  name: plasma_state_rlc
  ports:
    p: electrode
    n: 0
  electron_density_m3: ne
  momentum_collision_Hz: nu_m
  bulk_length_m: 0.0245
  area_m2: 0.00785398163397
  Csh_F: Csh
  variables:
    ne:
      bounds:
      - 2.0e14
      - 1.5e15
      scale: log
      default: 5.0e14
    nu_m:
      bounds:
      - 5.0e7
      - 2.0e8
      scale: log
      default: 1.0e8
    Csh:
      bounds:
      - 1.5e-11
      - 1.5e-10
      scale: log
      default: 4.8e-11
measurement:
  voltage_node: electrode
  current_source: Vsrc
solver:
  name: dummy
  tran:
    step_s: 2.0e-10
    stop_s: 7.3746e-07
target:
  waveform_file: target_gec_fundamental.csv
  objective: ccp_waveform_power_proxy
  fundamental_Hz: 13560000
  harmonics:
  - 1
  - 2
  - 3
  harmonic_weight: 0.15
  power_target_W: 50
  power_weight: 0.05
  constraints:
    max_abs_voltage_V: 900
    max_abs_current_A: 20
plasma_io:
  export: true
  geometry:
    electrode_diameter_m: 0.1
    electrode_area_m2: 0.00785398163397
    gap_m: 0.0245
  process_condition:
    gas: Ar
    pressure_Pa: 13.3
    frequency_Hz: 13560000
  requested_outputs:
  - Rp_ohm
  - Lp_H
  - Csh_F
  - ion_flux_m2_s
  - ion_energy_distribution
plugins:
- plugins/ccp_metrics.py
optimizer:
  name: random
  seed: 101
