[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-design-platform"
dynamic = ["version"]
description = "Scenario-aware RF circuit design-study engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10,<2",
  "pandas>=1.5",
  "PyYAML>=6.0",
  # Figure geometry is verified against the 0.23 placement/anchor contract.
  "schemdraw>=0.23,<0.24",
  # schemdraw only declares matplotlib as an extra, but `visualize-netlist`
  # writes PNG, which needs it.  It is a real runtime dependency.
  "matplotlib>=3.6,<4",
]

[project.scripts]
pcd = "pcd.cli:main"

# Only `pcd` is a Python package; documentation and examples are data below.
# Generated runs and tests are excluded from package discovery.
[tool.setuptools.packages.find]
include = ["pcd*"]
exclude = ["runs*", "tests*"]

[tool.setuptools.package-data]
pcd = ["py.typed"]

# Install the same manual maintained in the repository, without a second copy.
[tool.setuptools.data-files]
"share/pcd/docs" = ["docs/manual-ja.md", "docs/roadmap-ja.md"]
"share/pcd/docs/assets" = ["docs/assets/*.svg", "docs/assets/evidence.json"]
"share/pcd/examples" = ["examples/*.yaml", "examples/*.csv", "examples/README.md"]
"share/pcd/examples/circuits" = ["examples/circuits/*.cir"]
"share/pcd/examples/advanced" = ["examples/advanced/*.yaml", "examples/advanced/*.csv"]
"share/pcd/examples/advanced/plugins" = ["examples/advanced/plugins/*.py"]

[tool.setuptools.dynamic]
version = {attr = "pcd.__version__"}

[tool.uv]
# Refresh editable installs when metadata or shipped documentation changes.
cache-keys = [
  { file = "pyproject.toml" }, { file = "pcd/__init__.py" }, { file = "README.md" },
  { file = "docs/manual-ja.md" }, { file = "docs/assets/*.svg" }, { file = "docs/assets/evidence.json" },
  { file = "docs/roadmap-ja.md" }, { file = "examples/**" },
]

[dependency-groups]
dev = [
  "nox>=2024.4.15",
  "ruff>=0.16,<0.17",
  "pyrefly>=1.2,<2",
  "pytest>=7",
  "pytest-cov>=4.1",
  "types-PyYAML>=6.0",
  "import-linter>=2.0",
]

# Optional dependencies for the reproducible OptunaHub/TPE benchmark only.
# They are not imported by the PCD runtime or ordinary studies.
optuna-benchmark = [
  "optuna>=5.0,<6",
  "optunahub>=0.5,<0.6",
  "cmaes>=0.12,<1",
  "evotorch>=0.6,<0.7",
  "greenlet>=3.2,<4",
  "torch>=2.3,<3",
]

# -----------------------------------------------------------------------------
# Ruff: format + lint.  Rules are selected explicitly (never "ALL").
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["runs", "quality"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: undefined names, unused imports
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # bugbear: likely bugs
  "SIM",      # simplify
  "C4",       # comprehensions
  "A",        # builtin shadowing
  "TID",      # tidy imports
  "PT",       # pytest style
  "RUF",      # ruff-specific
  "S",        # bandit subset
  "NPY",      # numpy correctness
]
ignore = [
  "E501",  # line length is the formatter's job
  "S603",  # subprocess call: running a solver is this tool's purpose
  "S607",  # partial path: ngspice is intentionally resolved via PATH
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                    # assert is the point

[tool.ruff.lint.isort]
known-first-party = ["pcd"]

# -----------------------------------------------------------------------------
# Pyrefly: the single type checker.  Do not add a second one.
# -----------------------------------------------------------------------------
[tool.pyrefly]
project-includes = ["pcd", "tests", "bench", "noxfile.py"]
project-excludes = [
  "**/__pycache__/**", "**/.venv/**", "runs/**",
  # This publication-only plugin needs the optional optuna-benchmark group.
  "bench/figures/cases/plugins/optuna_samplers.py",
]
python-version = "3.10"

# -----------------------------------------------------------------------------
# pytest + coverage
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "e2e: end-to-end CLI journey; run in quality-pr and quality-nightly",
]

[tool.coverage.run]
branch = true
source = ["pcd"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]
