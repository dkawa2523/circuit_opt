name: quality

# The gate of record: re-runs `quality-pr` from a clean checkout and judges on
# the exit code, never on a summary written by whoever made the change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the real circuit solver
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - run: uv sync --group dev --frozen
      - run: uv run --frozen python -m nox -s quality-pr

  # Exercise the wheel outside the checkout, including supported minimum minors.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dependencies: [current, minimum]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the real circuit solver
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - run: uv build --wheel
      - run: uv venv --python 3.10 /tmp/pcd-wheel
      - if: matrix.dependencies == 'current'
        run: uv pip install --python /tmp/pcd-wheel/bin/python dist/*.whl
      - if: matrix.dependencies == 'minimum'
        run: >-
          uv pip install --python /tmp/pcd-wheel/bin/python dist/*.whl
          'numpy==1.23.5' 'pandas==1.5.3' 'scipy==1.10.1'
          'matplotlib==3.6.3' 'PyYAML==6.0' 'schemdraw==0.23'
      - working-directory: /tmp
        run: |
          /tmp/pcd-wheel/bin/python -I -m pcd list
          /tmp/pcd-wheel/bin/python -I -c "import numpy as np; from pcd.signals import time_average; from scipy.optimize import least_squares; assert time_average(np.array([0., 2.]), np.array([0., 1.])) == 1.; assert abs(least_squares(lambda x: x - 2, [1.], bounds=(0, 3)).x[0] - 2) < 1e-5"
          /tmp/pcd-wheel/bin/python -I -m pcd sim-netlist "$GITHUB_WORKSPACE/examples/rf_ccp_lumped.yaml" --out /tmp/package-smoke.cir
          /tmp/pcd-wheel/bin/python -I -m pcd run "$GITHUB_WORKSPACE/bench/cases/role_factorial_search.yaml" --output /tmp/package-study --require-acceptance --json
