name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-pr:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install ngspice on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice
      - name: Install ngspice on Windows
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-ngspice
      - name: Expose the Windows solver to native Python
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_LOCATION 'ucrt64/bin' >> $env:GITHUB_PATH
      - run: uv sync --group dev --frozen --python 3.12
      - run: uv run --frozen --no-sync python -m nox -s quality-pr
      - name: Build and install the wheel
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv build --wheel --out-dir "$env:RUNNER_TEMP/dist"
          uv venv --python 3.12 "$env:RUNNER_TEMP/pcd-wheel"
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP/dist" -Filter *.whl).FullName
          uv pip install --python "$env:RUNNER_TEMP/pcd-wheel" $wheel
      - name: Exercise the installed wheel outside the checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $python = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          & "$env:RUNNER_TEMP/pcd-wheel/$python" -I "$env:GITHUB_WORKSPACE/tests/wheel_smoke.py"

  packaging-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice
      - name: Build and install against the minimum dependency set
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv --python 3.10 "$RUNNER_TEMP/pcd-wheel"
          uv pip install --python "$RUNNER_TEMP/pcd-wheel" "$RUNNER_TEMP"/dist/*.whl \
            numpy==1.23.5 pandas==1.5.3 scipy==1.10.1 matplotlib==3.6.3 PyYAML==6.0 schemdraw==0.23
      - name: Exercise the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/pcd-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/wheel_smoke.py"'
