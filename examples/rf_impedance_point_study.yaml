# Search one pi network over independently supplied R+jX load points.
schema: pcd.rf.v1
case_id: rf_impedance_point_study
frequency_Hz: 13560000

network:
  type: pi_match
  search:
    C1: {values: [1.0e-11, 2.6e-10, 1.0e-9], default: 2.6e-10}
    L1: {values: [1.0e-7, 1.2e-6, 3.0e-6], default: 1.2e-6}
    C2: {values: [1.0e-12, 8.0e-12, 5.0e-10], default: 8.0e-12}

load:
  type: impedance_table
  points:
    - {scenario_id: strong_capacitive, resistance_ohm: 40, reactance_ohm: -140, weight: 1}
    - {scenario_id: nominal, resistance_ohm: 25, reactance_ohm: -80, weight: 2}
    - {scenario_id: weak_capacitive, resistance_ohm: 15, reactance_ohm: -35, weight: 1}
  reference_plane: electrode_terminal
  evidence: {origin: synthetic_example_table}

acceptance:
  reflected_power_fraction_max: 0.10
