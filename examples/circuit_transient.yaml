# Fixed RC step response; no optimization, objective, or scenario declarations.
schema: pcd.rf.v1
case_id: rc_step
parameters:
  fixed: {R: "1 kohm", C: "1 nF"}
source:
  type: voltage_pulse
  v1_V: 0
  v2_V: 5
  rise_s: "2 ns"
  fall_s: "2 ns"
  width_s: "3 us"
  period_s: "4 us"
circuit:
  output_node: out
  components:
    - {ref: R1, n1: src, n2: out, value: R}
    - {ref: C1, n1: out, n2: 0, value: C}
analysis:
  tran: {step_s: "2 ns", stop_s: "2 us"}
