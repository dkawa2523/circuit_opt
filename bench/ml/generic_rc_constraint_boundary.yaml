# Independent fixed grid for validating the locked generic-RC constraint classifier.
schema: case_yaml.v1
case_id: generic_rc_constraint_boundary
run: {root: runs/generic_rc_constraint_boundary, trials: 25}

source:
  type: voltage_pulse
  name: Vsrc
  p: src
  n: 0
  v1_V: 0
  v2_V: 5
  rise_s: 2.0e-9
  fall_s: 2.0e-9
  width_s: 1.0e-6
  period_s: 2.0e-6

circuit:
  builder: from_yaml
  output_node: out
  variables:
    R1: {choices: [150, 330, 680, 1500, 3300], scale: log}
    C1: {choices: [1.0e-10, 2.2e-10, 4.7e-10, 1.0e-9, 2.2e-9], scale: log}
  components:
    - {ref: R1, n1: src, n2: out, value: R1}
    - {ref: C1, n1: out, n2: 0, value: C1}

load: {name: none}
measurement: {voltage_node: out, current_source: Vsrc}
solver:
  name: ngspice_cli
  tran: {step_s: 2.0e-9, stop_s: 2.0e-6}
target:
  waveform_file: ../../examples/advanced/target_rc.csv
  objective: waveform_l2
  constraints:
    metric_bounds:
      peak_abs_voltage_V: {max: 4.9}
study:
  objectives:
    - {metric: normalized_rmse, direction: minimize, aggregation: worst}
    - {metric: peak_abs_voltage_V, direction: minimize, aggregation: worst}
optimizer: {name: grid}
