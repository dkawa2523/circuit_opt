# Frozen before either candidate pool is executed. Do not tune after outcomes are read.
schema: pcd.ml_ranking_protocol.v1
protocol_id: p3_fixed_sizing_ranking_20260930
claim: retrospective_fixed_candidate_pool

model:
  name: standardized_distance_weighted_knn
  neighbors: 3
  feasibility_threshold: 0.5

success_criterion:
  top_fraction: 0.10
  random_baseline_repeats: 101
  random_baseline_seed: 731993
  required_savings_fraction: 0.30
  require_every_case: true
  require_all_solver_evaluations: true
  verification: full_scenario_x_control_ngspice_rerun

cases:
  - case_id: ml_ranking_rc_waveform
    path: ranking_rc_waveform.yaml
    expected_candidates: 81
    solver_evaluations_per_candidate: 1
    initial_observations: 6
    initial_seed: 20260930
    feature_transforms:
      design.R1: log10
      design.C1: log10
    objective_directions:
      objective.normalized_rmse: minimize
      objective.peak_abs_voltage_V: minimize

  - case_id: ml_ranking_rf_match
    path: ranking_rf_match.yaml
    expected_candidates: 81
    solver_evaluations_per_candidate: 1
    initial_observations: 6
    initial_seed: 20260930
    feature_transforms:
      design.C1: log10
      design.L1: log10
    objective_directions:
      objective.reflection_magnitude: minimize

limitations:
  - This protocol measures retrospective ordering inside two simulated fixed-topology pools.
  - It does not establish Bayesian optimization, uncertainty calibration, cross-circuit generalization, or plasma-model validity.
  - A failed case is retained as evidence; the model, pool, seeds, and threshold are not retuned.
