# P3 preregistered fixed pool: transient RC target-waveform sizing.
schema: case_yaml.v1
case_id: ml_ranking_rc_waveform
run: {trials: 81}

source:
  type: voltage_pulse
  name: Vsrc
  p: src
  n: 0
  v1_V: 0
  v2_V: 5
  rise_s: 2.0e-9
  fall_s: 2.0e-9
  width_s: 1.0e-6
  period_s: 2.0e-6

circuit:
  builder: from_yaml
  output_node: out
  variables:
    R1:
      choices: [100, 177.8279, 316.2278, 562.3413, 1000, 1778.279, 3162.278, 5623.413, 10000]
      scale: log
    C1:
      choices: [1.0e-10, 2.371e-10, 5.623e-10, 1.333e-9, 3.162e-9, 7.499e-9, 1.778e-8, 4.217e-8, 1.0e-7]
      scale: log
  components:
    - {ref: R1, n1: src, n2: out, value: R1}
    - {ref: C1, n1: out, n2: 0, value: C1}

load: {name: none}
measurement: {voltage_node: out, current_source: Vsrc}
solver:
  name: ngspice_cli
  tran: {step_s: 2.0e-9, stop_s: 2.0e-6}
target:
  waveform_file: ../../examples/advanced/target_rc.csv
  objective: waveform_l2
  constraints:
    metric_bounds:
      peak_abs_voltage_V: {max: 4.9}
study:
  candidate_enumeration: exact
  objectives:
    - {metric: normalized_rmse, direction: minimize, aggregation: worst}
    - {metric: peak_abs_voltage_V, direction: minimize, aggregation: worst}
optimizer: {name: grid, seed: 0}
