# A5: public-schema end-to-end check for the identifiable effective ICP
# transformer port. The fixed L-match is analytically matched only at 13.56 MHz.
schema: pcd.rf.v1
case_id: benchmark_icp_transformer_frequency_conformance

network:
  type: l_match
  fixed:
    L1: 8.712592931020065e-6
    C1: 7.415445982210926e-11

load:
  type: icp_transformer
  reference_plane: coil_feedthrough
  evidence: {origin: analytic_benchmark, qualified_frequency_Hz: [10000000, 20000000]}
  parameters:
    R_coil_ohm: 0.4
    L_coil_H: 2.0e-6
    reflected_inductance_H: 2.45e-7
    secondary_damping_rate_rad_s: 6.66666666667e+6
    C_parallel_F: 2.0e-11

conditions:
  - {id: low_frequency, frequency_Hz: 10000000}
  - {id: nominal_frequency, frequency_Hz: 13560000}
  - {id: high_frequency, frequency_Hz: 20000000}

acceptance:
  reflected_power_fraction_max: 0.10
