limitations:
  - The plasma-on R and X curves in Figures 2 and 3 are not tabulated.
  - The paper does not publish the matcher capacitor ranges or settings.
  - The helical source and global RFZ60 plane do not qualify a planar production ICP.
  - The dummy fixture validates parasitic topology, not plasma physics.
